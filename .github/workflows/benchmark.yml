name: Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install fastapi flask falcon sanic sanic-testing httpx

    - name: Run framework benchmark
      run: |
        PYTHONPATH=. python benchmark.py | tee /tmp/benchmark_output.txt

    - name: Publish results to job summary
      run: |
        {
          echo "### :stopwatch: Framework Benchmark"
          echo ""
          echo '```text'
          cat /tmp/benchmark_output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
