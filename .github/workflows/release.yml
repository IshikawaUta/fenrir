name: Release & Publish to PyPI

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/fenrir-framework

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Extract changelog section for this version
      run: |
        python - <<'EOF'
        import os, re
        tag = os.environ.get("GITHUB_REF_NAME", "")
        text = open("CHANGELOG.md").read()
        pattern = re.compile(rf"^### {re.escape(tag)}[^\n]*\n(.*?)(?=\n### |\Z)", re.M | re.S)
        m = pattern.search(text)
        body = m.group(1).strip() if m else f"No changelog entry found for {tag}."
        header = f"# {tag}"
        if tag.startswith("v"):
            header += f"\n\nFull changes: see [CHANGELOG.md](CHANGELOG.md)"
        open("/tmp/release_body.md", "w").write(f"{header}\n\n{body}\n")
        EOF

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --notes-file /tmp/release_body.md \
          dist/*

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
