[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrir-framework"
version = "2.3.4"
description = "A hybrid Python web framework combining Flask, FastAPI, Bottle, Falcon, and Sanic"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "asteri>=2.2.2",
    "itsdangerous>=2.0.0",
    "python-multipart>=0.0.18",
    "typing_extensions>=4.0.0"
]

[project.scripts]
fenrir = "fenrir.cli:main"

[project.optional-dependencies]
redis = ["redis>=4.0.0"]

[tool.setuptools]
packages = ["fenrir"]

[tool.setuptools.package-data]
fenrir = ["logo.png", "logo.jpg"]
