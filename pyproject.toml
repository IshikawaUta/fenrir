[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrir-framework"
version = "4.1.0"
description = "A hybrid Python web framework combining Flask, FastAPI, Bottle, Falcon, and Sanic"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "asteri>=2.2.2",
    "itsdangerous>=2.0.0",
    "python-multipart>=0.0.18",
    "typing_extensions>=4.0.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
fenrir = "fenrir.cli:main"

[project.optional-dependencies]
redis = ["redis>=4.0.0"]
sqlite = ["aiosqlite>=0.19.0"]
postgresql = ["asyncpg>=0.29.0"]
orm = ["aiosqlite>=0.19.0", "asyncpg>=0.29.0"]
graphql = ["strawberry-graphql>=0.200.0"]
grpc = ["grpcio>=1.58.0", "grpcio-health-checking>=1.58.0"]
all = [
    "redis>=4.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "strawberry-graphql>=0.200.0",
    "grpcio>=1.58.0",
    "grpcio-health-checking>=1.58.0",
]

[tool.setuptools]
packages = ["fenrir", "fenrir.monitoring"]

[tool.setuptools.package-data]
fenrir = ["logo.png", "logo.jpg"]
